name: Build Bruce (Waveshare ESP32-S3-Touch-LCD-3.5)

on:
  push:
    branches: [ bruce-waveshare-integration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare Waveshare Board Variant & Vendor Libs
        run: |
          set -e
          # Клонируем исходники Waveshare
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.5.git /tmp/waveshare
          
          # 1. Создаем официальную структуру вариантов плат для PlatformIO
          # Это решает проблему pins_arduino.h на 100%
          mkdir -p custom_variants/esp32-s3-touch-lcd-3-5
          cp /tmp/waveshare/Arduino/boards/esp32-s3-touch-lcd-3-5/* custom_variants/esp32-s3-touch-lcd-3-5/
          
          # 2. Копируем библиотеки
          mkdir -p lib
          cp -R /tmp/waveshare/Arduino/libraries/XPowersLib lib/ || true
          cp -R /tmp/waveshare/Arduino/libraries/GFX_Library_for_Arduino lib/ || true
          cp -R /tmp/waveshare/Arduino/libraries/lvgl lib/ || true
          cp -R /tmp/waveshare/Arduino/libraries/TFT_eSPI lib/ || true

      - name: Patch XPowersLib (Disable PMU Watchdog)
        run: |
          set -e
          # Отключаем ватчдог, чтобы плата не уходила в ребут
          if [ -d lib/XPowersLib/src ]; then
            find lib/XPowersLib/src -type f -name '*.cpp' -print0 | xargs -0 sed -i -e "s/enableWatchdog();/disableWatchdog();\n    \/\/ Disabled by CI/g" || true
          fi

      - name: Configure PlatformIO Environment
        run: |
          set -e
          # Добавляем конфигурацию с четким указанием кастомной папки вариантов (variants_dir)
          if ! grep -q '\[env:esp32s3-waveshare\]' platformio.ini 2>/dev/null; then
            cat << 'EOF' >> platformio.ini

          [env:esp32s3-waveshare]
          platform = espressif32
          framework = arduino
          
          # Базовая плата и наша переопределенная конфигурация
          board = esp32-s3-devkitc-1
          board_build.variants_dir = custom_variants
          board_build.variant = esp32-s3-touch-lcd-3-5
          board_build.flash_size = 16MB
          
          build_flags =
            ${env.build_flags}
            -DCONFIG_PMU_SDA=8
            -DCONFIG_PMU_SCL=7
            -DCONFIG_PMU_IRQ=15
            -DUSER_SETUP_LOADED=1
            -DHAS_SCREEN=1
            
          lib_deps =
            ${env.lib_deps}
          EOF
          fi

      - name: Build firmware
        run: pio run -e esp32s3-waveshare -v

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare
          path: .pio/build/esp32s3-waveshare/firmware.bin
