name: Build Bruce (Waveshare ESP32-S3-Touch-LCD-3.5)

on:
  push:
    branches: [ bruce-waveshare-integration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e waveshare-esp32s3-touch-lcd-35 -v

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare
          path: .pio/build/waveshare-esp32s3-touch-lcd-35/firmware.bin
