name: Build Bruce (Waveshare ESP32-S3-Touch-LCD-3.5)

on:
  push:
    branches: [ bruce-waveshare-integration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare Waveshare Vendor Libs & Headers
        run: |
          set -e
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.5.git /tmp/waveshare
          mkdir -p lib
          
          cp -R /tmp/waveshare/Arduino/libraries/XPowersLib lib/ || true
          cp -R /tmp/waveshare/Arduino/libraries/GFX_Library_for_Arduino lib/ || true
          cp -R /tmp/waveshare/Arduino/libraries/lvgl lib/ || true
          
          mkdir -p include
          if [ -f "boards/esp32-s3-touch-lcd-3-5/pins_arduino.h" ]; then
            cp boards/esp32-s3-touch-lcd-3-5/pins_arduino.h include/
          else
            echo '#include <Arduino.h>' > include/pins_arduino.h
          fi

      - name: Patch XPowersLib (Disable PMU Watchdog)
        run: |
          set -e
          if [ -d lib/XPowersLib/src ]; then
            find lib/XPowersLib/src -type f -name '*.cpp' -print0 | xargs -0 sed -i -e "s/enableWatchdog();/disableWatchdog();\n    \/\/ Disabled by CI/g" || true
          fi

      - name: Configure PlatformIO Environment
        run: |
          set -e
          if ! grep -q '\[env:esp32s3-waveshare\]' platformio.ini 2>/dev/null; then
            cat << 'EOF' >> platformio.ini

          [env:esp32s3-waveshare]
          platform = espressif32
          framework = arduino
          board = esp32-s3-devkitc-1
          board_build.flash_size = 16MB
          board_build.partitions = default_16MB.csv
          
          build_flags =
            -O3
            -DCORE_DEBUG_LEVEL=0
            -DARDUINO_USB_CDC_ON_BOOT=1
            -DARDUINO_USB_MODE=1
            -DBOARD_HAS_PSRAM
            -mfix-esp32-psram-cache-issue
            -DCONFIG_PMU_SDA=8
            -DCONFIG_PMU_SCL=7
            -DCONFIG_PMU_IRQ=15
            -DHAS_SCREEN=1
            -DWAVESHARE_ESP32_S3_TOUCH_LCD_3_5=1
            -DLCD_WIDTH=800
            -DLCD_HEIGHT=480
            -DLCD_DE=40
            -DLCD_VSYNC=41
            -DLCD_HSYNC=42
            -DLCD_PCLK=39
            -DLCD_R0=45 -DLCD_R1=48 -DLCD_R2=47 -DLCD_R3=0 -DLCD_R4=21
            -DLCD_G0=14 -DLCD_G1=38 -DLCD_G2=18 -DLCD_G3=17 -DLCD_G4=16 -DLCD_G5=15
            -DLCD_B0=8  -DLCD_B1=3  -DLCD_B2=46 -DLCD_B3=9  -DLCD_B4=1
            
          lib_deps =
            Wire
            SPI
          EOF
          fi

      - name: Build firmware
        run: pio run -e esp32s3-waveshare -v

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare
          path: .pio/build/esp32s3-waveshare/firmware.bin
