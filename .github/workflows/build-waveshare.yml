name: Build Bruce (Waveshare ESP32-S3-Touch-LCD-3.5)

on:
  push:
    branches: [ bruce-waveshare-integration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Prepare Waveshare Vendor Libs
        run: |
          set -e
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.5.git /tmp/waveshare
          mkdir -p lib
          cp -R /tmp/waveshare/Arduino/libraries/XPowersLib lib/ || true
          cp -R /tmp/waveshare/Arduino/libraries/GFX_Library_for_Arduino lib/ || true
          cp -R /tmp/waveshare/Arduino/libraries/lvgl lib/ || true
          if [ -d "/tmp/waveshare/Arduino/libraries/TFT_eSPI" ]; then
            cp -R /tmp/waveshare/Arduino/libraries/TFT_eSPI lib/ || true
          fi

      - name: Ensure include/pins_arduino.h exists
        run: |
          set -e
          mkdir -p include
          if [ -f "boards/esp32-s3-touch-lcd-3-5/pins_arduino.h" ]; then
            cp boards/esp32-s3-touch-lcd-3-5/pins_arduino.h include/
          else
            echo '#include <Arduino.h>' > include/pins_arduino.h
          fi

      - name: Patch XPowersLib (Disable PMU Watchdog)
        run: |
          set -e
          if [ -d lib/XPowersLib/src ]; then
            find lib/XPowersLib/src -type f -name '*.cpp' -print0 | xargs -0 sed -i -e "s/enableWatchdog();/disableWatchdog();\n    \/\/ Disabled by CI/g" || true
          fi

      - name: Configure PlatformIO Environment with Screen Macro Flags
        run: |
          set -e
          if ! grep -q '\[env:esp32s3-waveshare\]' platformio.ini 2>/dev/null; then
            cat << 'EOF' >> platformio.ini

          [env:esp32s3-waveshare]
          platform = espressif32
          framework = arduino
          board = esp32-s3-devkitc-1
          board_build.flash_size = 16MB
          
          build_flags =
            ${env.build_flags}
            -Iinclude
            -DCONFIG_PMU_SDA=8
            -DCONFIG_PMU_SCL=7
            -DCONFIG_PMU_IRQ=15
            -DUSER_SETUP_LOADED=1
            -DHAS_SCREEN=1
            -DTFT_WIDTH=320
            -DTFT_HEIGHT=480
            -DILI9488_DRIVER=1
            
          lib_deps =
            ${env.lib_deps}
            SPI
            Wire
          EOF
          fi

      - name: Build firmware
        run: pio run -e esp32s3-waveshare -v

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-waveshare
          path: .pio/build/esp32s3-waveshare/firmware.bin
