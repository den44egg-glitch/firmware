#################################### Waveshare ESP32-S3-Touch-LCD 3.5B ##############################
; Waveshare ESP32-S3-Touch-LCD 3.5B (https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-3.5)
; Hardware: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB OPI PSRAM)
;           ILI9488 480x320 IPS over SPI, XPT2046 resistive touch over SPI
; TFT SPI:        MOSI=13, MISO=-1, SCLK=14, CS=10, DC=9, BL=2 (PWM)
; Touch XPT2046:  SPI shared, CS=3, IRQ=4
; SD Card SPI:    MOSI=13, MISO=15, SCK=14, CS=14 (shared SPI)
; I2C:            SDA=6, SCL=7
; UART:           TX=43, RX=44

[env:waveshare-s3-touch-lcd35]
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
platform = espressif32@6.5.0
build_src_filter = ${env.build_src_filter} +<../boards/waveshare-s3-touch-lcd35>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-Iboards/waveshare-s3-touch-lcd35
	-Os
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; Serial/GPS
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; BadUSB on UART2 pins
	-DBAD_TX=17
	-DBAD_RX=18

	; No RGB LED
	-DRGB_LED=-1

	; Buttons - touch only
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0

	; IR/RF free pins
	-DIR_TX_PINS='{{"Pin 6", 6}, {"Pin 7", 7}}'
	-DIR_RX_PINS='{{"Pin 6", 6}, {"Pin 7", 7}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DRF_TX_PINS='{{"Pin 6", 6}, {"Pin 7", 7}}'
	-DRF_RX_PINS='{{"Pin 6", 6}, {"Pin 7", 7}}'

	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; Screen
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=2
	-DMINBRIGHT=10

	; TFT_eSPI - SPI display (ILI9488, 480x320)
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DILI9488_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_MOSI=13
	-DTFT_MISO=-1
	-DTFT_SCLK=14
	-DTFT_CS=10
	-DTFT_DC=9
	-DTFT_RST=48
	-DTFT_BL=2
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000

	; Touch XPT2046 resistive SPI
	-DHAS_TOUCH=1
	-DTOUCH_CS=3
	-DTOUCH_IRQ=4

	; SD Card SPI
	-DSDCARD_CS=14
	-DSDCARD_SCK=14
	-DSDCARD_MISO=15
	-DSDCARD_MOSI=13

	; SPI bus pin aliases
	-DSPI_SCK_PIN=14
	-DSPI_MOSI_PIN=13
	-DSPI_MISO_PIN=15
	-DSPI_SS_PIN=10

	; Backlight PWM
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000

	-DDEVICE_NAME='"Waveshare S3 Touch LCD 3.5"'

lib_deps =
	${env.lib_deps}
